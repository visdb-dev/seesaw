name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # enable manual trigger

# Default for all jobs is read-only. Only the deploy job, which runs no
# repository code, gets the permissions needed to publish to Pages.
permissions:
  contents: read

# One deploy at a time; let an in-progress deploy finish rather than
# cancelling it partway through
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Runs the build (repository code, Maven plugins) with a read-only token.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Javadoc
        run: mvn javadoc:aggregate -B

      # Compresses the javadoc output directory into a cloud artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'target/reports/apidocs'
          retention-days: 1

  # Publishes the artifact made by the build job; no checkout, no build.
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Modern GitHub configuration to bypass Jekyll processing
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Feeds the artifact straight to the github.io hosting server
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
