name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches:
      - main  # or master
  workflow_dispatch: # enable the manual trigger

# Grants direct cloud delivery access without requiring a git branch
permissions:
  contents: read
  pages: write
  id-token: write

# Stops older runs if you push code changes back-to-back
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7 # Checked and verified current 

      - name: Set up JDK
        uses: actions/setup-java@v6 # Checked and verified current 
        with:
          java-version: '25' 
          distribution: 'temurin'
          cache: 'maven'     

      - name: Generate Javadoc
        run: mvn javadoc:javadoc -P release -pl :seesaw -am -B 

      # Modern GitHub configuration to bypass Jekyll processing 
      - name: Setup Pages
        uses: actions/configure-pages@v6 # Audited and bumped to v6

      # Compresses your javadoc output directory into a cloud artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3 # Audited and maintained at v3

      # Feeds the artifact straight to your github.io hosting server
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5 # Audited and bumped to v5


