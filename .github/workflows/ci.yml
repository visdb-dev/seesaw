name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual trigger

permissions:
  contents: read

# Stops older runs if you push code changes back-to-back
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    # frgaal compiles source 24 to target 17 on any of these JDKs, and the
    # tests then run on that same JDK. 17 is the minimum runtime.
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn verify -B -ntp -fae  # -fae: report failures in every module

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
